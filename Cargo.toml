[package]
name = "ptest"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Procedural macros for parameterized testing: value, type, and matrix test generation"
license = "MIT"
repository = "https://github.com/amadavan/ptest-macros"
keywords = ["test", "testing", "parameterized", "proc-macro", "test-generation"]
categories = ["development-tools::testing"]
authors = ["Avinash"]

[lib]
proc-macro = true

[dependencies]
convert_case = "0.9.0"
deluxe = "0.5.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = {version = "2.0.104", features = ["full"]}
